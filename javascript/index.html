
<!DOCTYPE html>
<html>
<head>
    <title>Module 12 - Events and Forms</title>
</head>
<body>

    <h2>Task 1: Click Event</h2>
    <button id="clickBtn">Click Me</button>
    <p id="status">Waiting for click...</p>

    <hr>

    <h2>Task 2: Live Character Count</h2>
    <input type="text" id="message" placeholder="Type something">
    <p>Character count: <span id="count">0</span></p>

    <hr>

    <h2>Task 3 & 4: Registration Form</h2>
    <form id="registerForm">
        <input type="text" id="name" placeholder="Enter name">
        <br><br>

        <input type="email" id="email" placeholder="Enter email">
        <br><br>

        <button type="submit">Register</button>
    </form>

    <p id="feedback"></p>

    <hr>

    <h2>Challenge: Join Events</h2>
    <div id="eventCards">
        <div>
            <h3>Event 1</h3>
            <button class="joinBtn">Join</button>
        </div>

        <div>
            <h3>Event 2</h3>
            <button class="joinBtn">Join</button>
        </div>

        <div>
            <h3>Event 3</h3>
            <button class="joinBtn">Join</button>
        </div>
    </div>

    <p id="joinStatus"></p>

    <script src="script.js"></script>
</body>
</html>
